# The date each panel lender announced its results for the quarter ended 31 Dec 2020 --
# the day its Dec-2020 proforma GNPA became public. Used by credit_risk/market_test.py.
#
# `basis` says how the date is known:
#   filing   -- printed on the lender's own filing in sources/filings/
#   coverage -- date of same-day press coverage of the results
#   inferred -- no direct statement found; reasoning given in `note`
# The event window (close before the announcement day to close of the trading day after)
# is wide enough to absorb an after-hours or weekend announcement, but NOT a date that is
# wrong by a day or more -- hence the basis column.

dates:
  hdfc_bank:                  {date: "2021-01-16", basis: coverage, note: "a Saturday"}
