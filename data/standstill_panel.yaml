# Lender-level panel: reported vs PROFORMA gross/net NPA under the Supreme Court NPA
# standstill (interim order of 3 Sep 2020 in Gajendra Sharma v. Union of India, barring
# classification as NPA of any account not NPA on 31 Aug 2020; vacated 23 Mar 2021), plus
# each lender's first reported figure after the order was lifted (31 Mar 2021).
#
# "Proforma" = the lender's own disclosure of what its NPA ratio would have been had the
# order not been in place. This is measured hidden stress, lender by lender -- it replaces
# the assumed parameter k in analysis.compute_shadow_gnpa.
#
# PROVENANCE. Every observation carries `src`, a key into that lender's `sources`, and `p`,
# the page it was read from. A source is either:
#   primary   -- the lender's own filing, downloaded to sources/filings/ (gitignored: the
#                PDFs are the lenders' copyright) and read directly with scripts/pdf_grep.py.
#                `sha256_16` is the first 16 hex chars of the file's SHA-256 as downloaded.
#   secondary -- press coverage of the lender's results; NOT read from the filing itself.
# No value here is derived, interpolated or estimated. A missing value is a gap, left out.
#
# COMPARABILITY CAVEATS, all real and all stated by the lenders themselves:
#   - Definitions of "proforma" differ. HDFC Bank's uses "its analytical models" for early
#     recognition, not only 90 days past due. Bajaj Finance calls its figure "adjusted".
#     Bandhan Bank's CEO said on the Q3 FY21 call that its 7.1% conservatively counts
#     partially-paying microfinance customers.
#   - RBL Bank restated its Dec-2020 proforma net NPA from 2.37% (Q3 FY21 presentation) to
#     2.52% (Q4 FY21 presentation). Both are recorded; the original is used.
#   - Restructured-book figures use different denominators (advances / net advances /
#     funded assets / gross customer assets) -- the basis is recorded per lender.
#   - Bajaj Finance is an NBFC (Ind AS, Stage 3 basis); the rest are banks.

