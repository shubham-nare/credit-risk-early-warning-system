  as_of: "2020-12"
  proforma_gnpa_pct: 8.3
  proforma_gnpa_lakh_cr: 8.7
  reported_gnpa_lakh_cr: 7.4
  proforma_nnpa_pct: 2.7
  source: "https://www.businesstoday.in/amp/industry/banks/story/sc-verdict-on-loan-moratorium-banks-gross-npas-to-increase-by-rs-13-lakh-crore-291532-2021-03-23"

known_gaps:
  - "23 lenders: 11 from the pilot and 12 added in the scale-up. The added twelve lean more on secondary sources."
  - "Shriram Transport Finance has no Mar-2021 figure yet, so it is in the hidden-stress table but not the catch-up test."
  - "Low-precision proforma figures: Yes Bank (reported in coverage only as 20 per cent) and Canara Bank (about 8.95%, from an earnings call quoted in search results)."
  - "Looked for and NOT found, so left out: proforma ratios for Bank of India, City Union Bank (rupee slippage only), Mahindra Finance and Cholamandalam (rupee amounts only)."
  - "Stage 1 (moratorium share of book, Apr/Jun 2020) is filled for Bajaj Finance only."
  - "Stage 3 (restructured share) is filled for Dec-2020 / Mar-2021 where the filing already read happened to state it; Sep-2021 is not collected."
  - "Stage 4 (FY22 outcome: reported GNPA plus write-offs) is not collected."
  - "Sep-2020 proforma is missing for Bandhan Bank, IDFC First Bank and PNB."
  - "Secondary-sourced among the pilot eleven: ICICI Bank gross proforma ratios, HDFC Bank and Axis Bank Mar-2021 figures, and all of PNB."
  - "Not a random sample: lenders were chosen because a proforma figure could be found, so lenders that disclosed clearly are over-represented."
