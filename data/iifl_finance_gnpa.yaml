  "2020-09": {gnpa_pct: 1.81, nnpa_pct: 0.77}   # Q2 FY21, AS REPORTED -- see regulatory_forbearance_evidence

# Directly relevant to this project's core thesis: IIFL Finance itself disclosed, in the
# same investor presentation, exactly what its Q2 FY21 GNPA/NNPA would have been WITHOUT a
# specific regulatory-forbearance mechanism -- real, quantified, primary-sourced evidence
# for the "NPA recognition was suppressed by a policy intervention, not just genuinely
# lower defaults" mechanism this project's analysis (analysis.py) offers as an
# interpretation of why RBI's own COVID stress test overshot the real outcome.
regulatory_forbearance_evidence:
  as_of: "2020-09"
  mechanism: "Supreme Court interim order (from 3 Sep 2020) barring classification of accounts as NPA after 31 Aug 2020"
  reported_gnpa_pct: 1.81
  reported_nnpa_pct: 0.77
  proforma_gnpa_pct_without_the_order: 2.77
  proforma_nnpa_pct_without_the_order: 1.29
  implied_gnpa_suppression_pp: 0.96   # 2.77 - 1.81
  implied_nnpa_suppression_pp: 0.52   # 1.29 - 0.77
  source: "IIFL Finance Q2 FY21 investor presentation, proforma GNPA/NNPA slide, read directly"
