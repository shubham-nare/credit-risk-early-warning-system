# Scheduled Commercial Bank (SCB) system-level Gross NPA ratio -- actual outcomes plus
# RBI's own published stress-test projections -- spanning the IL&FS (2018-19) and COVID
# (2020-21) windows.
#
# PROVENANCE: RBI's own domain (rbidocs.rbi.org.in) CAPTCHA-blocks automated fetches of
# these FSR PDFs (confirmed independently three times now). However, a later pass found
# the same primary PDFs mirrored by third parties (e.g. PHDCCI) and was able to read one
# FSR edition directly that way -- see data/nbfc_gnpa.yaml, which used this route to
# upgrade several NBFC numbers to primary-sourced. The SCB figures below have not yet
# been re-verified via that route; they remain corroborated by at least two independent
# secondary sources each that cite the FSR directly on its release day (Business
# Standard, current-affairs summary sites), not primary-verified. A worthwhile follow-up,
# not done here since the existing secondary corroboration is already reasonably strong.

actual_gnpa_pct:
  "2018-03": 11.5   # secondary: Business Standard "Statsguru," citing FSR
  "2018-09": 10.8   # secondary: Business Standard, citing FSR
  "2019-09": 9.3    # secondary: Indian Finance Association analysis PDF, citing FSR Dec 2019 (Issue 20)
  "2020-03": 8.5    # secondary: FSR July 2020 (Issue 21) -- corroborated by 2 independent web searches
  "2021-03": 7.48   # secondary: actual outcome, Business Standard / PIB
  "2021-09": 6.9    # secondary: actual outcome, Business Standard / PIB

rbi_stress_projections:
  - projection_made_in: "FSR July 2020 (Issue 21)"
    as_of_date: "2020-03"
    as_of_gnpa_pct: 8.5
    target_date: "2021-03"
    baseline_pct: 12.5
    severe_pct: 14.7
  - projection_made_in: "FSR January 2021"
    target_date: "2021-09"
    baseline_pct: 13.5
    severe_pct: 14.8

known_gaps:
  - "RESOLVED (see data/nbfc_gnpa.yaml): the NBFC-sector March-2019 conflict (5.3% vs 6.1%)
     turned out to be neither figure -- the primary FSR table gives 6.6% for FY2018-19;
     6.1% is actually FY2016-17's figure, a different year entirely."
  - "RESOLVED (see data/nbfc_stress_test.yaml): RBI does run an NBFC-specific stress test,
     but it is structured differently from this SCB one -- a capital-adequacy (CRAR)
     sensitivity test under NPA shocks, not a future GNPA-level projection, so it is not
     directly comparable/scoreable the way the SCB projections above are."
