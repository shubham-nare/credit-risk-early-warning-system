# Every macro stress-test BASELINE projection of the scheduled-commercial-bank (SCB) gross
# NPA ratio that RBI has published in its Financial Stability Report (FSR), December 2014
# to June 2026, with the actual outcome at each target date.
#
# PROVENANCE: PRIMARY throughout. Each figure was read from RBI's own website -- either
# the press release for that FSR edition (`pr`: rbi.org.in/Scripts/BS_PressReleaseDisplay
# .aspx?prid=N) or the FSR's Chapter II as published in HTML (`pub`: rbi.org.in/Scripts/
# PublicationReportDetails.aspx?ID=N). scripts/fetch_rbi_fsr.py downloads the press
# releases; scripts/html_grep.py prints the sentence. (The FSR *PDFs* on rbidocs.rbi.org.in
# are CAPTCHA-blocked to scripts; these HTML pages are not.)
#
# WHAT A "BASELINE" IS, AND IS NOT. RBI presents these as conditional scenario results,
# not as forecasts: the baseline is the path implied by its model under the macro outlook
# at the time. From June 2022 the text adds "under the assumption of no further regulatory
# reliefs". Scoring them against outcomes is still a fair test of how informative the
# published number was -- but it is this project's framing, not RBI's.
#
# COMPARABILITY CAVEATS:
#   - From December 2024 the projection is stated for "46 banks" (not "all SCBs") and the
#     horizon lengthens from about one year to 18-24 months.
#   - Actuals are recorded as FIRST PUBLISHED (the as-of figure in the next FSR). Later
#     revisions are noted, not substituted.

