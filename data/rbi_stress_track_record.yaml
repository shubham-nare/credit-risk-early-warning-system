unscored:
  - edition: "FSR Jun 2014"
    reason: "Baseline given as a range, not a point: 'around 4 per cent to 4.1 per cent during the financial year 2014-15' (severe: 5.1 by March 2015). The March 2015 actual was 4.6."
    src: {pub: 791}
  - edition: "FSR Jun 2010 to Dec 2013"
    reason: "Press releases for these eight editions state no GNPA baseline; their chapters have not been read."

# RBI also publishes a baseline for a SAMPLE of NBFCs (e.g. FSR Dec 2025: 2.3% in Sep 2025
# to 2.9% in Sep 2026; FSR Jun 2026: 2.4% in Mar 2026 to 2.8% in Mar 2027). Not included:
# the sample changes between editions, so projection and outcome are not like-for-like.
