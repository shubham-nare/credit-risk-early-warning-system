# PRE-REGISTERED FORECAST. Generated by scripts/preregister_forecast.py; never edited by hand.
# It counts only from the moment it is committed and pushed -- see the git history for that time.

target_quarter: 2026-09
what_is_forecast: each lender's reported gross NPA ratio (%) at the end of the target quarter
created_utc: '2026-10-01T20:16:43+00:00'
first_results_expected: 2026-10-17 (HDFC Bank and Axis Bank, per press coverage of announced board-meeting dates;
  not checked against the exchange filings)
input_data:
  file: data/quarterly_gnpa.yaml
  sha256: a47802cff5b07dcd5dcb1844a2837ebb318794761a7060b9f40a1a919b5323ac
  source: screener.in company pages (secondary aggregator of exchange filings)
  history: 2023-06 to 2026-06, 35 lenders
excluded_lenders:
  BAJFINANCE: source shows 1.20% for Jun 2026 vs 0.96% in results coverage; which figure is which is unresolved,
    so the target is ambiguous
method:
  candidates:
  - no_change
  - own_drift
  - seasonal
  - sector_drift
  - pooled_ar1
  - pooled_ar1_seas
  benchmark: no_change
  selection_rule: lowest mean absolute error (percentage points) in an expanding-window backtest; ties to the simpler
    method
  backtest:
  - method: no_change
    n: 210
    mae_pp: 0.1917
    median_abs_rel_error_pct: 6.6
    share_closer_than_benchmark_pct: null
  - method: own_drift
    n: 210
    mae_pp: 0.1933
    median_abs_rel_error_pct: 5.76
    share_closer_than_benchmark_pct: 52.9
  - method: seasonal
    n: 210
    mae_pp: 0.1789
    median_abs_rel_error_pct: 5.15
    share_closer_than_benchmark_pct: 57.1
  - method: sector_drift
    n: 210
    mae_pp: 0.1497
    median_abs_rel_error_pct: 4.08
    share_closer_than_benchmark_pct: 70.5
  - method: pooled_ar1
    n: 210
    mae_pp: 0.1565
    median_abs_rel_error_pct: 4.83
    share_closer_than_benchmark_pct: 67.1
  - method: pooled_ar1_seas
    n: 210
    mae_pp: 0.1531
    median_abs_rel_error_pct: 4.58
    share_closer_than_benchmark_pct: 64.3
  selected: sector_drift
  fitted_coefficients:
  - -0.05513
  plain_reading: 'sector_drift multiplies every lender''s last GNPA by the same factor, exp(coefficient): the average
    quarterly percentage change across all lenders and past quarters.'
scoring_rules:
  actual: the lender's first-reported gross NPA ratio for the target quarter, read from the same source after results,
    and cross-checked against the lender's own results release for the standstill-panel lenders; later restatements
    are ignored
  primary_metric: mean absolute error in percentage points over all lenders that have reported by the cutoff
  win_condition: the selected method's MAE is lower than the no_change benchmark's MAE on the same lenders
  secondary:
  - share of lenders for which the selected method is closer than no_change
  - share of actuals inside the 80% interval (well calibrated if roughly 70-90%)
  cutoff: '2026-11-30'
  dropped_if: the lender has not reported by the cutoff, has merged, or has changed its NPA definition; every drop
    is listed in the scored file
  no_edits: this file is never edited after it is committed; a correction is a new file that says so
stated_risk: The history is 13 quarters in which GNPA fell at almost every lender. A method that extrapolates that
  fall wins the backtest and will lose to the benchmark if the cycle turns this quarter. That is the same failure
  this project documents in RBI's baselines, which under-called every large move. Losing to no_change is a live
  possibility and would be reported as such.
